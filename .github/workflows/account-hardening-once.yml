name: One-shot account hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/account-hardening-once.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Apply bounded account hardening patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src-tauri/src/account.rs")
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              text = text.replace(old, new, 1)

          consume_start = text.index(
              "    pub fn consume(&mut self, plan_id: &str) -> AppResult<StoredLoginPlan> {"
          )
          purge_start = text.index("    fn purge_expired(&mut self) {", consume_start)
          consume_and_take = '''    pub fn consume(&mut self, plan_id: &str) -> AppResult<StoredLoginPlan> {
              let stored = self.take(plan_id)?;
              if stored.plan.expires_at < Utc::now() {
                  return Err(AppError::InvalidInput(
                      "Sign-in plan expired; preview again".to_string(),
                  ));
              }

              let status = discover_status(Vec::new(), None);
              if account_fingerprint(&status) != stored.account_fingerprint {
                  return Err(AppError::InvalidInput(
                      "Account or client state changed after sign-in preview; preview again".to_string(),
                  ));
              }
              for operation in stored.executables.values() {
                  let current = native_process::fingerprint_regular_file(&operation.path)?;
                  if current != operation.fingerprint {
                      return Err(AppError::InvalidInput(
                          "A sign-in executable changed after preview; preview again".to_string(),
                      ));
                  }
              }
              Ok(stored)
          }

          fn take(&mut self, plan_id: &str) -> AppResult<StoredLoginPlan> {
              self.purge_expired();
              self.plans.remove(plan_id).ok_or_else(|| {
                  AppError::InvalidInput(
                      "Sign-in plan is missing, expired, or was already consumed; preview again"
                          .to_string(),
                  )
              })
          }

          '''
          text = text[:consume_start] + consume_and_take + text[purge_start:]

          replace_once(
              '''        self.ensure_writable()?;
              let run = LoginRunRecord {
          ''',
              '''        self.ensure_writable()?;
              let previous = self.state.clone();
              let run = LoginRunRecord {
          ''',
              "begin-run snapshot",
          )
          replace_once(
              '''        if let Err(error) = self.persist() {
                  self.state.runs.retain(|item| item.id != run.id);
                  return Err(error);
              }
          ''',
              '''        if let Err(error) = self.persist() {
                  self.state = previous;
                  return Err(error);
              }
          ''',
              "begin-run rollback",
          )
          replace_once(
              '''    for surface in &status.surfaces {
                  surface.surface.hash(&mut hasher);
          ''',
              '''    for surface in &status.surfaces {
                  surface.surface.as_str().hash(&mut hasher);
          ''',
              "stable surface fingerprint",
          )
          replace_once(
              '''            native_process::resolve_candidates([
                      "/Applications/Visual Studio Code.app/Contents/MacOS/Electron",
                      "/Applications/Visual Studio Code - Insiders.app/Contents/MacOS/Electron",
                  ])
          ''',
              '''            native_process::resolve_candidates([
                      "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code",
                      "/Applications/Visual Studio Code - Insiders.app/Contents/Resources/app/bin/code-insiders",
                      "/Applications/Visual Studio Code.app/Contents/MacOS/Electron",
                      "/Applications/Visual Studio Code - Insiders.app/Contents/MacOS/Electron",
                  ])
          ''',
              "macOS VS Code launchers",
          )
          replace_once(
              '''fn validate_avatar_url(value: String) -> Option<String> {
              let url = Url::parse(&value).ok()?;
              (url.scheme() == "https" && url.host_str().is_some()).then_some(value)
          }
          ''',
              '''fn validate_avatar_url(value: String) -> Option<String> {
              if value.len() > MAX_ACCOUNT_TEXT_BYTES {
                  return None;
              }
              let url = Url::parse(&value).ok()?;
              (url.scheme() == "https" && url.host_str().is_some()).then_some(value)
          }
          ''',
              "avatar URL bound",
          )
          replace_once(
              '''    } else {
                  format!("{}…", &value[..MAX_ACCOUNT_TEXT_BYTES])
              }
          }
          ''',
              '''    } else {
                  let mut end = MAX_ACCOUNT_TEXT_BYTES.min(value.len());
                  while !value.is_char_boundary(end) {
                      end -= 1;
                  }
                  format!("{}…", &value[..end])
              }
          }
          ''',
              "UTF-8-safe diagnostic truncation",
          )

          test_start = text.index("    #[test]\n    fn login_plans_are_one_shot() {")
          next_test = text.index(
              "    #[test]\n    fn empty_surface_request_selects_all_clients()",
              test_start,
          )
          deterministic_test = '''    #[test]
              fn login_plans_are_one_shot_without_live_discovery() {
                  let mut store = LoginPlanStore::default();
                  let now = Utc::now();
                  let plan = LoginPlan {
                      id: "one-shot".to_string(),
                      target_identity: None,
                      requested_surfaces: vec![LoginSurface::GithubCopilotApp],
                      operations: Vec::new(),
                      created_at: now,
                      expires_at: now + ChronoDuration::minutes(15),
                  };
                  store.plans.insert(
                      plan.id.clone(),
                      StoredLoginPlan {
                          plan: plan.clone(),
                          account_fingerprint: "test".to_string(),
                          executables: BTreeMap::new(),
                      },
                  );
                  let _ = store.take(&plan.id).expect("consume");
                  assert!(store.take(&plan.id).is_err());
              }

          '''
          text = text[:test_start] + deterministic_test + text[next_test:]

          invalid_login_marker = '''    #[test]
              fn invalid_github_logins_are_rejected() {
          '''
          utf8_test = '''    #[test]
              fn bounded_detail_never_splits_utf8() {
                  let value = "🙂".repeat(MAX_ACCOUNT_TEXT_BYTES);
                  let detail = bounded_detail(&value);
                  assert!(detail.ends_with('…'));
                  assert!(detail.is_char_boundary(detail.len()));
              }

          '''
          replace_once(
              invalid_login_marker,
              utf8_test + invalid_login_marker,
              "UTF-8 test insertion",
          )

          path.write_text(text)
          PY

      - name: Format and validate
        run: |
          cargo fmt --all
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/account-hardening-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden account orchestration lifecycle"
          git push origin HEAD:main
