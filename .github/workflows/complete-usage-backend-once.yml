name: Complete local usage backend once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/complete-usage-backend-once.yml

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize reviewed source blobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/src-tauri/src

          fetch_plain_blob() {
            local sha="$1"
            local destination="$2"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$destination"
          }

          fetch_gzip_payload() {
            local sha="$1"
            local destination="$2"
            local encoded="$RUNNER_TEMP/${sha}.txt"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$encoded"
            python3 - "$encoded" "$destination" <<'PY'
          import base64
          import gzip
          import sys
          from pathlib import Path

          encoded = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          Path(sys.argv[2]).write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          PY
          }

          fetch_plain_blob 58e1c9ceb042377e7c6365d6670cf5931da63363 \
            apps/desktop/src-tauri/src/decimal.rs
          fetch_plain_blob a3965bd17638ec430fd17114acbc4697f3d6568e \
            apps/desktop/src-tauri/src/price_catalog.rs
          fetch_plain_blob 03293d8ad40b7f8a654fb720f4d328a339f0b116 \
            apps/desktop/src-tauri/src/lib.rs
          fetch_gzip_payload 92b243d75684e81e822a6747042128fc80c2d6ff \
            apps/desktop/src-tauri/src/commands.rs
          fetch_gzip_payload 74d35769ea99f18cdabbf2d35d4a63a16ea5dea3 \
            apps/desktop/src-tauri/src/usage_db.rs
          fetch_gzip_payload 9a37d84e891c285d7ae429f31822c753a97c32a0 \
            apps/desktop/src-tauri/src/usage.rs

      - name: Apply validation findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          usage = Path("apps/desktop/src-tauri/src/usage.rs")
          text = usage.read_text(encoding="utf-8")
          text = text.replace(
              "use crate::price_catalog::{self, CanonicalModelIdentity, PriceCatalogStatus, PriceQuote};",
              "use crate::price_catalog::{self, PriceCatalogStatus, PriceQuote};",
          )
          text = text.replace(
              "use rusqlite::{params, OptionalExtension};",
              "use rusqlite::params;",
          )
          text = text.replace(
              "const MAX_LINE_BYTES: usize = 1 * 1_024 * 1_024;",
              "const MAX_LINE_BYTES: usize = 1_024 * 1_024;",
          )
          text = text.replace(
              "\nfn record_sync_run(\n",
              "\n#[allow(clippy::too_many_arguments)]\nfn record_sync_run(\n",
              1,
          )
          usage.write_text(text, encoding="utf-8")

          usage_db = Path("apps/desktop/src-tauri/src/usage_db.rs")
          text = usage_db.read_text(encoding="utf-8")
          text = text.replace(
              "    pub fn update_source_observation(\n",
              "    #[allow(clippy::too_many_arguments)]\n    pub fn update_source_observation(\n",
              1,
          )
          usage_db.write_text(text, encoding="utf-8")

          test = Path("apps/desktop/src-tauri/tests/usage_db.rs")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              "        request_hash: None,\n        input_semantics: InputSemantics::TotalIncludesCacheReadAndWrite,",
              "        request_hash: None,\n        canonical_model_id: None,\n        route: \"unknown\".to_string(),\n        attribution_confidence: \"unknown\".to_string(),\n        input_semantics: InputSemantics::TotalIncludesCacheReadAndWrite,",
              1,
          )
          text = text.replace(
              "        output: Some(output),\n        started_at: Some(Utc::now()),",
              "        output: Some(output),\n        reasoning: None,\n        request_count: None,\n        started_at: Some(Utc::now()),",
              1,
          )
          text = text.replace(
              "        source_created_at: Some(Utc::now()),\n    }",
              "        source_created_at: Some(Utc::now()),\n        logical_surfaces: vec![\"copilot-cli\".to_string(), \"github-copilot-app\".to_string()],\n        price_snapshot_id: None,\n        estimate_usd: None,\n        estimate_status: \"unpriced\".to_string(),\n        quality_flags: Vec::new(),\n    }",
              1,
          )
          test.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate implementation
        id: validation
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/usage-backend-validation.log"
          : > "$log"
          failed=0

          run_check() {
            printf '\n===== %s =====\n' "$*" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
            printf '===== exit %s =====\n' "$status" | tee -a "$log"
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          }

          run_check npm ci
          run_check cargo fmt --all
          run_check npm run check:web
          run_check cargo test --workspace --locked
          run_check cargo clippy --workspace --all-targets --locked -- -D warnings
          run_check git diff --check

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-backend-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/usage-backend-validation.log
          retention-days: 7
          if-no-files-found: error

      - name: Commit exact implementation to main
        if: steps.validation.outputs.failed == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/complete-usage-backend-once.yml
          cargo fmt --all -- --check
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import local Copilot usage and price estimates"
          git push origin HEAD:main

      - name: Fail when validation failed
        if: steps.validation.outputs.failed != '0'
        shell: bash
        run: |
          echo "Local usage backend validation failed; inspect the uploaded diagnostics artifact." >&2
          exit 1
