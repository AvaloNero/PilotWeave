name: One-shot frontend plan lifecycle hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/frontend-plan-lifecycle-once.yml

permissions:
  contents: write

jobs:
  patch-check-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Harden consumed-plan handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          account_path = Path("apps/desktop/web/account-ui.js")
          account = account_path.read_text()
          account = replace_once(
              account,
              '${loading || selectable.length === 0 ? "disabled" : ""}>Sign in and sync',
              '${loading || selectable.length === 0 || status?.historyRecovery ? "disabled" : ""}>Sign in and sync',
              "read-only history button guard",
          )
          account = replace_once(
              account,
              '  async function previewLogin() {\n    if (loading || !accountStatus) return;\n',
              '  async function previewLogin() {\n    if (loading || !accountStatus) return;\n    if (accountStatus.historyRecovery) {\n      showToast(\n        "Resolve the read-only sign-in history before starting a new run",\n        "error",\n      );\n      return;\n    }\n',
              "read-only history command guard",
          )
          account = replace_once(
              account,
              '      const result = await invoke("apply_login_plan", { planId: plan.id });\n      currentPlan = null;\n',
              '      const result = await invoke("apply_login_plan", { planId: plan.id });\n      validateStatus(result.accountStatus);\n      currentPlan = null;\n',
              "apply response validation",
          )

          account_apply_start = account.index("  async function applyPlan(plan) {")
          account_catch_start = account.index("    } catch (error) {", account_apply_start)
          account_catch_end = account.index(
              "  }\n\n  function showResultModal(run)", account_catch_start
          )
          account_catch = '''    } catch (error) {
              closeModal();
              showToast(
                `${error?.message ?? String(error)} Generate a new preview before retrying.`,
                "error",
              );
            }
          
          '''
          account = (
              account[:account_catch_start]
              + account_catch
              + account[account_catch_end:]
          )
          account_path.write_text(account)

          installer_path = Path("apps/desktop/web/installer-ui.js")
          installer = installer_path.read_text()
          installer_apply_start = installer.index("  async function applyPlan(plan) {")
          installer_catch_start = installer.index(
              "    } catch (error) {", installer_apply_start
          )
          installer_catch_end = installer.index(
              "  }\n\n  function showResultModal(result)", installer_catch_start
          )
          installer_catch = '''    } catch (error) {
              closeModal();
              showToast(
                `${error?.message ?? String(error)} Generate a new preview before retrying.`,
                "error",
              );
            }
          
          '''
          installer = (
              installer[:installer_catch_start]
              + installer_catch
              + installer[installer_catch_end:]
          )
          installer_path.write_text(installer)
          PY

      - name: Validate browser application syntax
        run: npm run check:web

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/frontend-plan-lifecycle-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: require fresh previews after consumed plan failures"
          git push origin HEAD:main
