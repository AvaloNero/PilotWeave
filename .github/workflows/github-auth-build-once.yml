name: One-shot GitHub authorization validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/github-auth-build-once.yml

permissions:
  contents: write

jobs:
  format-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Apply authorization regression fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/desktop/src-tauri/src/github_auth.rs")
          text = path.read_text()

          old_import = "use std::collections::HashMap;\n"
          new_import = "#[cfg(test)]\nuse std::collections::HashMap;\n"
          if text.count(old_import) != 1:
              raise SystemExit("expected exactly one test-only HashMap import")
          text = text.replace(old_import, new_import, 1)

          old_lock = '.expect("memory secrets")'
          new_lock = ".unwrap_or_else(|poisoned| poisoned.into_inner())"
          if text.count(old_lock) != 3:
              raise SystemExit(
                  f"expected three fake-secret lock assertions, found {text.count(old_lock)}"
              )
          text = text.replace(old_lock, new_lock)

          old_token_check = (
              "    if token.trim() != token || token.chars().any(char::is_control) {\n"
              "        return Err(AppError::InvalidInput(\n"
              "            \"GitHub authorization token must not contain whitespace padding or control characters\"\n"
              "                .to_string(),\n"
              "        ));\n"
              "    }\n"
          )
          new_token_check = (
              "    if token.trim() != token\n"
              "        || !token.is_ascii()\n"
              "        || token.chars().any(char::is_control)\n"
              "    {\n"
              "        return Err(AppError::InvalidInput(\n"
              "            \"GitHub authorization token must be ASCII and must not contain whitespace padding or control characters\"\n"
              "                .to_string(),\n"
              "        ));\n"
              "    }\n"
          )
          if text.count(old_token_check) != 1:
              raise SystemExit("expected exactly one token validation block")
          text = text.replace(old_token_check, new_token_check, 1)

          old_test = (
              '        assert!(validate_token_input("github_pat_test").is_ok());\n'
          )
          new_test = (
              '        assert!(validate_token_input("github_pat_test").is_ok());\n'
              '        assert!(validate_token_input("github_pat_令牌").is_err());\n'
          )
          if text.count(old_test) != 1:
              raise SystemExit("expected exactly one token validation test marker")
          text = text.replace(old_test, new_test, 1)

          path.write_text(text)
          PY

      - name: Validate browser syntax
        run: npm run check:web

      - name: Format and validate Rust
        run: |
          cargo fmt --all
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/github-auth-build-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete separate GitHub authorization core"
          git push origin HEAD:main
