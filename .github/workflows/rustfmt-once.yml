name: One-shot Rust formatting

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rustfmt-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt

      - name: Normalize Rust files
        run: cargo fmt --all

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/rustfmt-once.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize Rust sources"
          git push origin HEAD:main
