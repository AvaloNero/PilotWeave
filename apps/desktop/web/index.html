<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PilotWeave</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="installer.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="github-auth.css" />
    <link rel="stylesheet" href="setup-usage.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <div>
            <strong>PilotWeave</strong>
            <small>Your Copilot setup</small>
          </div>
        </div>

        <nav id="primary-nav" aria-label="Primary navigation">
          <button class="nav-item active" data-route="overview">
            <span class="nav-icon">⌂</span><span>Home</span>
          </button>
          <button class="nav-item" data-route="connections">
            <span class="nav-icon">◇</span><span>Connections</span>
          </button>
          <button class="nav-item" data-route="usage">
            <span class="nav-icon">◷</span><span>Usage</span>
          </button>
          <details class="more-nav"><summary class="nav-item"><span class="nav-icon">···</span><span>More</span></summary>
          <button class="nav-item" data-route="clients"><span class="nav-icon">▦</span><span>Client diagnostics</span></button>
          <button class="nav-item" data-route="activity">
            <span class="nav-icon">↗</span><span>Activity</span>
          </button>
          <button class="nav-item" data-route="settings">
            <span class="nav-icon">⚙</span><span>Settings</span>
          </button>
          <button class="nav-item" data-route="about"><span class="nav-icon">ⓘ</span><span>About</span></button>
          </details>
        </nav>

        <div class="sidebar-footer">
          <div class="runtime-dot"></div>
          <div>
            <strong id="runtime-label">Loading</strong>
            <small id="runtime-detail">Checking backend</small>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">PILOTWEAVE</p>
            <h1 id="page-title">Home</h1>
            <p id="page-subtitle">One model setup across every Copilot surface.</p>
          </div>
          <div class="topbar-actions">
            <button id="refresh-button" class="button ghost">Refresh</button>
            <button id="add-connection-button" class="button primary">Add connection</button>
          </div>
        </header>
        <section id="content" class="content" aria-live="polite"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" aria-live="assertive"></div>
    <script src="deployment-review.js"></script>
    <script src="installer-ui.js"></script>
    <script src="account-ui.js"></script>
    <script src="github-auth-ui.js"></script>
    <script src="setup-ui.js"></script>
    <script src="usage-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
